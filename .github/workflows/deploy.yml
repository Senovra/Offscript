# Builds the static site and publishes it to GitHub Pages.
# One-time setup in the repository: Settings > Pages > Source: "GitHub Actions".
#
# BASE PATH
#   Now (senovra.github.io/Offscript) : NEXT_PUBLIC_BASE_PATH = /Offscript
#   After connecting offscript.website: change the two values in the "env" block
#   below to:  NEXT_PUBLIC_BASE_PATH: ""   and   NEXT_PUBLIC_SITE_URL: https://offscript.website
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build the static site
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /Offscript
          NEXT_PUBLIC_SITE_URL: https://senovra.github.io/Offscript

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4